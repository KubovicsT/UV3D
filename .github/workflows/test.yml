name: UV3D offline slicer tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux Qt and shader validation libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxcb-cursor0 glslang-tools
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Test slicer and GUI startup
        run: python -m pytest -q
      - name: Validate all OpenGL 3.3 shaders without GPU (Linux)
        if: runner.os == 'Linux'
        run: python scripts/validate_shaders.py
      - name: Validate Windows installation and update script syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($file in @('Install-UV3D.ps1', 'Update-UV3D.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              throw "$file has PowerShell parse errors: $($errors | Out-String)"
            }
          }
      - name: Bootstrap folder-local runtime (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\\Install-UV3D.ps1 -NoLaunch
          if ($LASTEXITCODE -ne 0) { throw 'Portable installer failed' }
      - name: Smoke test portable Python and desktop UI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = 'offscreen'
          & .\\runtime\\python\\python.exe -c "from PySide6.QtWidgets import QApplication; from uv3d.app import MainWindow; a=QApplication([]); w=MainWindow(); assert w.windowTitle().startswith('UV3D'); w.close()"
          if ($LASTEXITCODE -ne 0) { throw 'Portable Python GUI smoke failed' }
      - name: Smoke test isolated mask generation with portable Python (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $root = (Get-Location).Path
          $python = Join-Path $root 'runtime\python\python.exe'
          $source = Join-Path $root 'workspace\testcube.stl'
          $output = Join-Path $root 'workspace\jobs\ci_isolated'
          $logs = Join-Path $root 'workspace\logs'
          $request = Join-Path $root 'workspace\ci_isolated.json'
          & $python -c "import trimesh; trimesh.creation.box(extents=(2,2,1)).export(r'$source')"
          if ($LASTEXITCODE -ne 0) { throw 'Failed creating test mesh' }
          @{
            source=$source
            output=$output
            log_dir=$logs
            settings=@{layer_mm=0.5; dpi=72}
          } | ConvertTo-Json -Depth 5 | Set-Content -Encoding UTF8 $request
          & $python -m uv3d.slicer_process --request $request
          if ($LASTEXITCODE -ne 0) { throw 'Portable isolated worker failed' }
          if (-not (Test-Path (Join-Path $output 'job.json'))) {
            throw 'Portable worker did not write job manifest'
          }
