name: UV3D offline slicer tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Test slicer and GUI startup
        run: python -m pytest -q
      - name: Validate Windows installation and update script syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($file in @('Install-UV3D.ps1', 'Update-UV3D.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              throw "$file has PowerShell parse errors: $($errors | Out-String)"
            }
          }
